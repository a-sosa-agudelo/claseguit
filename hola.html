<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Una bienvenida sencilla y cálida.">
    <title>Hola, qué gusto verte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="welcome" aria-labelledby="title">
            <div class="copy">
                <p class="eyebrow">Un pequeño comienzo</p>
                <h1 id="title">Hola, qué gusto verte.</h1>
                <p class="intro">Este espacio está listo para recibir tus ideas, proyectos y próximos pasos.</p>
                <button id="welcomeButton" type="button">Saludar de vuelta</button>
                <a class="store-link" href="tienda.html">Entrar a la tienda</a>
                <p class="note" id="message" role="status" aria-live="polite"></p>
            </div>
            <div class="visual" aria-hidden="true">
            </div>
        </section>
    </main>
    <script>
        function saludar() {
            const mensaje = document.querySelector('#message');
            const boton = document.querySelector('#welcomeButton');

            mensaje.textContent = '¡Hola! Ya podemos empezar.';
            boton.textContent = '¡Saludo enviado!';
        }

        document.querySelector('#welcomeButton').addEventListener('click', saludar);
    </script>
</body>
</html>
